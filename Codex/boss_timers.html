<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss timers &amp; kill log</title>
<!--
  Served by the bridge at GET /boss_page, which makes it same-origin with the
  JSON routes. It also works opened straight off disk: BASE below falls back
  to the absolute loopback address when the protocol is file:.

  TIMEZONE. Every timestamp crossing the wire is ISO-8601 UTC, exactly as
  /bosses already sends it, and the conversion happens HERE through
  Intl.DateTimeFormat with a named zone. Nothing server-side computes an
  offset and nothing anywhere hardcodes -04:00: the operator is UTC-04:00
  today, but US DST ends 2026-11-01, and a baked-in offset would quietly go
  an hour wrong on every timer that night. A named zone handles it.
-->
<style>
  :root { --bg:#11151c; --panel:#171d26; --line:#242d3a; --txt:#d7dee8;
          --dim:#8b98ab; --up:#7FD98A; --dead:#e2605a; --warn:#e8b457;
          --accent:#6fb3e0; --hot:#c58bd6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; font-weight:600; }
  h2 { font-size:13px; margin:22px 0 8px; font-weight:600; color:var(--accent); }
  .tabs { display:flex; gap:4px; }
  .tab, select { padding:4px 11px; border:1px solid var(--line); border-radius:4px;
         cursor:pointer; color:var(--dim); background:#131922; font:inherit; }
  .tab.on { color:var(--txt); border-color:var(--accent); background:#1b2430; }
  select { color:var(--txt); }
  .grow { flex:1; }
  #status { color:var(--dim); font-size:12px; }
  #status.bad { color:var(--dead); }
  main { padding:12px 16px 48px; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:11px;
       text-transform:uppercase; letter-spacing:.05em; padding:6px 10px;
       border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:5px 10px; border-bottom:1px solid #1c2531; white-space:nowrap; }
  tr:hover td { background:#1a212c; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); } .up { color:var(--up); } .dead { color:var(--dead); }
  .warn { color:var(--warn); } .hot { color:var(--hot); }
  .thin td { opacity:.42; }              /* below the trend threshold */
  .bar { position:relative; width:100px; height:9px; background:#232c38;
         border-radius:2px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .bar i { position:absolute; inset:0 auto 0 0; background:var(--up); }
  .bar.low i { background:var(--warn); } .bar.crit i { background:var(--dead); }
  .pill { padding:1px 6px; border-radius:3px; font-size:11px; border:1px solid; }
  .pill.up { border-color:#2f5e3a; background:#16301d; color:var(--up); }
  .pill.dead { border-color:#5e2f2f; background:#301616; color:var(--dead); }
  .pill.stale { border-color:#5e4f2f; background:#302716; color:var(--warn); }
  .note { color:var(--dim); margin:0 0 10px; max-width:84ch; }
  .empty { color:var(--dim); padding:24px 10px; }
  code { color:var(--hot); }
  b.hi { color:var(--txt); }
  /* Schedule: one row per start time, one cell per event at that time. */
  .filters { display:flex; gap:4px; flex-wrap:wrap; margin:0 0 10px; }
  .fchip { padding:2px 8px; border:1px solid var(--line); border-radius:3px; font-size:11px;
           cursor:pointer; background:#131922; user-select:none; }
  .fchip.off { opacity:.35; text-decoration:line-through; }
  .ev { font-weight:600; } .rk { font-size:11px; color:var(--dim); margin-left:4px; }
  .ev.r1, .ev.r2 { color:var(--dead); } .ev.r3 { color:var(--warn); }
  .ev.r4 { color:var(--hot); } .ev.r5, .ev.r6 { color:var(--accent); } .ev.r7 { color:var(--dim); }
  td.evcell { min-width:150px; border-left:1px solid #1c2531; vertical-align:top; }
  td.evcell .evhead { margin-bottom:3px; }
  .chip { display:inline-block; padding:0 5px; margin:0 3px 2px 0; border:1px solid var(--line);
          border-radius:3px; font-size:11px; color:var(--dim); }
  .chip b { color:var(--txt); font-weight:600; }
  tr.daysep td { color:var(--accent); font-size:11px; padding-top:12px; border-bottom:1px solid var(--line); }
  tr.liverow td { background:#16201a; }
</style>
</head>
<body>
<header>
  <h1>Boss timers</h1>
  <div class="tabs">
    <button class="tab on" data-v="now">Now</button>
    <button class="tab" data-v="timers">Timers</button>
    <button class="tab" data-v="sched">Schedule</button>
    <button class="tab" data-v="rank">Server ranking</button>
  </div>
  <select id="type" hidden></select>
  <select id="hours" hidden>
    <option value="24" selected>next 24h</option><option value="48">next 48h</option>
    <option value="168">next 7 days</option>
  </select>
  <span class="grow"></span>
  <span id="status">connecting…</span>
</header>
<main><div id="view"></div></main>

<script>
/* Same-origin when served from /boss_page; absolute when opened from disk. */
const BASE = location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8787";
const TZ = "America/New_York";
let VIEW = "now", TYPE = "mrgreen", BOSSES = null, HIST = null, SCHED = null, ERR = null;
/* /schedule_live is fetched on its own so an older bridge without the route
   still renders every other tab; LIVE_ERR then selects the legacy view. */
let LIVE = null, LIVE_ERR = null, HOURS = 24;

const fClock = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, hour:"numeric", minute:"2-digit", hour12:true });
const fStamp = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, month:"short", day:"numeric", hour:"numeric", minute:"2-digit", hour12:true });
const fDow = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, weekday:"short", hour:"numeric", minute:"2-digit", hour12:true });
const fDay = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, weekday:"short", month:"short", day:"numeric" });
const tzName = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, timeZoneName:"short" }).formatToParts(new Date())
  .find(p => p.type === "timeZoneName").value;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const clock = iso => iso ? fClock.format(new Date(iso)) : "—";
const stamp = iso => iso ? fStamp.format(new Date(iso)) : "—";
const num = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
function dur(sec) {
  if (sec == null || !isFinite(sec)) return "—";
  const s = Math.max(0, Math.round(sec)), h = Math.floor(s/3600),
        m = Math.floor((s%3600)/60), r = s%60;
  return h ? `${h}h${String(m).padStart(2,"0")}m` : m ? `${m}m${String(r).padStart(2,"0")}s` : `${r}s`;
}
const secsTo = iso => iso ? (new Date(iso).getTime() - Date.now())/1000 : null;

async function grab(p) {
  const r = await fetch(BASE + p, { cache:"no-store" });
  if (!r.ok) throw new Error(p + " -> HTTP " + r.status);
  return r.json();
}
async function refresh() {
  try {
    const [b, h, sc] = await Promise.all([
      grab("/bosses"), grab("/boss_history"), grab("/schedule?hours=48")]);
    BOSSES = b; HIST = h; SCHED = sc; ERR = null;
  } catch (x) { ERR = x.message; }
  try { LIVE = await grab("/schedule_live?hours=" + HOURS); LIVE_ERR = null; }
  catch (x) { LIVE = null; LIVE_ERR = x.message; }
  syncTypes(); paint();
}

function allTypes() {
  const set = new Set();
  (BOSSES?.bosses || []).forEach(r => set.add(r.type));
  (HIST?.history || []).forEach(r => set.add(r.type));
  return [...set].sort();
}
function syncTypes() {
  const sel = document.getElementById("type"), types = allTypes();
  document.getElementById("hours").hidden = VIEW !== "sched";
  sel.hidden = (VIEW === "now") || (VIEW === "sched") || !types.length;
  if (sel.hidden) return;
  if (!types.includes(TYPE)) TYPE = types[0];
  sel.innerHTML = types.map(t =>
    `<option${t === TYPE ? " selected" : ""}>${esc(t)}</option>`).join("");
}

function statusLine() {
  const el = document.getElementById("status");
  if (ERR) { el.className = "bad"; el.textContent = "bridge unreachable — " + ERR; return; }
  const p = BOSSES.poller, bits = [];
  if (!p.enabled) bits.push("poller OFF");
  else if (p.last_error) bits.push(`ALData failing ×${p.consecutive_failures} (backing off)`);
  else bits.push(`polled ${p.last_success_age_sec ?? "?"}s ago`);
  bits.push(`${BOSSES.count} tracked`, `${HIST.deaths} kills logged`, `times ${tzName}`);
  if (p.events_error) bits.push("LOG WRITE FAILING");
  el.className = (p.last_error || p.events_error || !p.enabled) ? "bad" : "";
  el.textContent = bits.join(" · ");
}

/* ------------------------------------------------------------------- now */
function nowView() {
  const rows = (BOSSES.bosses || []).slice().sort((a, b) => {
    const ad = a.live && a.dps > 0, bd = b.live && b.dps > 0;
    if (ad !== bd) return ad ? -1 : 1;                      // dying first
    if (a.live !== b.live) return a.live ? -1 : 1;          // then merely up
    return (secsTo(a.estimated_respawn) ?? 1e12) - (secsTo(b.estimated_respawn) ?? 1e12);
  });
  if (!rows.length) return `<p class="empty">Nothing tracked yet — the poller seeds on its
    first successful ALData call.</p>`;
  return `<p class="note">Live and dying first, then up, then soonest back.
    <code>dps 0</code> is measured — somebody looked and nothing is happening — while
    <code>—</code> means not enough refreshed readings yet. Those are different answers,
    and the first one is a boss being abandoned.</p>
  <table><thead><tr>
    <th>Boss</th><th>Server</th><th>Status</th><th>HP</th><th class="num">HP left</th>
    <th class="num">dps</th><th>When</th><th>Target</th>
  </tr></thead><tbody>${rows.map(nowRow).join("")}</tbody></table>`;
}
function nowRow(r) {
  const pct = r.pct == null ? null : Math.max(0, Math.min(100, r.pct));
  const cls = pct == null ? "" : pct < 15 ? " crit" : pct < 50 ? " low" : "";
  let pill = r.live ? `<span class="pill up">UP</span>`
           : r.estimated_respawn ? `<span class="pill dead">DEAD</span>`
           : `<span class="pill stale">?</span>`;
  if (r.live && r.stale) pill += ` <span class="warn">stale</span>`;
  let when;
  if (r.live) {
    when = r.eta_sec != null
      ? `<span class="up">up, ~${dur(r.eta_sec)} left</span>`
      : r.dps === 0 ? `<span class="warn">up, nothing happening</span>`
                    : `<span class="dim">up</span>`;
  } else if (r.estimated_respawn) {
    const s = secsTo(r.estimated_respawn);
    when = `respawns <b class="hi">${clock(r.estimated_respawn)}</b> ` +
           `<span class="${s != null && s < 300 ? "warn" : "dim"}">` +
           `(${s == null ? "—" : s <= 0 ? "due" : "in " + dur(s)})</span>`;
  } else when = `<span class="dim">—</span>`;
  return `<tr>
    <td>${esc(r.type)}</td><td>${esc(r.server)}</td><td>${pill}</td>
    <td>${pct == null ? '<span class="dim">—</span>'
        : `<span class="bar${cls}"><i style="width:${pct}%"></i></span> <span class="dim">${pct.toFixed(1)}%</span>`}</td>
    <td class="num">${num(r.hp)}</td>
    <td class="num ${r.dps === 0 ? "warn" : ""}">${r.dps == null ? "—" : num(r.dps)}</td>
    <td>${when}</td>
    <td>${r.target ? esc(r.target) : '<span class="dim">—</span>'}</td>
  </tr>`;
}

/* ---------------------------------------------------------------- timers */
function timersView() {
  const rows = (BOSSES.bosses || []).filter(r => r.type === TYPE)
    .sort((a, b) => (secsTo(a.estimated_respawn) ?? (a.live ? -1 : 1e12))
                  - (secsTo(b.estimated_respawn) ?? (b.live ? -1 : 1e12)));
  if (!rows.length) return `<p class="empty">No ${esc(TYPE)} entries tracked.</p>`;
  const cycle = rows[0].respawn_sec;
  return `<p class="note">Next <b class="hi">${esc(TYPE)}</b> window per server, ${tzName}.
    ${cycle ? `Nominal cycle ${dur(cycle)}.` : `No respawn constant for this type — it is
    event-spawned, so no timer is computed.`}</p>
  <table><thead><tr>
    <th>Server</th><th>Status</th><th class="num">HP left</th>
    <th>Respawns</th><th class="num">In</th><th class="num">Last seen</th>
  </tr></thead><tbody>${rows.map(r => {
    const s = secsTo(r.estimated_respawn);
    return `<tr>
      <td>${esc(r.server)}</td>
      <td>${r.live ? '<span class="pill up">UP NOW</span>' :
            r.estimated_respawn ? '<span class="pill dead">dead</span>' :
            '<span class="pill stale">?</span>'}</td>
      <td class="num">${r.live ? num(r.hp) : "—"}</td>
      <td>${r.live ? '<span class="up">now</span>'
            : r.estimated_respawn ? `<b class="hi">${clock(r.estimated_respawn)}</b>` : "—"}</td>
      <td class="num ${s != null && s > 0 && s < 300 ? "warn" : ""}">${
        r.live ? "—" : s == null ? "—" : s <= 0 ? "due" : dur(s)}</td>
      <td class="num dim">${r.age_sec == null ? "—" : dur(r.age_sec) + " ago"}</td>
    </tr>`; }).join("")}</tbody></table>`;
}

/* -------------------------------------------------------------- schedule */
/* A COPY OF bossRank()'s table in Party/Ranger.js, because this page cannot
   load a CODE slot. Tests/suite_bosstimers.js fails if the two drift, so edit
   both together. Colour and left-to-right order within a row follow it. */
const SCHED_RANK = {
  dragold: 1,
  franky: 2,
  goobrawl: 3,
  crabxx: 4, wabbit: 4,
  horseman: 5, graveyard: 5,
  witchcipher: 6,
  mrgreen: 7,
  snowman: 8, grinch: 8, mrpumpkin: 8,
};
const SCHED_RANK_DEFAULT = Math.max.apply(null, Object.values(SCHED_RANK)) + 1;
function schedRank(ev) {
  const r = SCHED_RANK[ev];
  return typeof r === "number" ? r : SCHED_RANK_DEFAULT;
}
/* Shards sort I, II, III ... then PVP, not alphabetically (IV before V). */
const SCHED_SHARD_ORDER = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "PVP"];
function schedShardKey(s) {
  const i = SCHED_SHARD_ORDER.indexOf(s);
  return i < 0 ? 100 : i;
}
/* Region -> shards that PUBLISHED a lineup. "all" on a chip means all of
   these, so a shard the bridge cannot reach shrinks the denominator rather
   than turning every "all" into a list; the header counts reporting shards. */
function schedRegionShards(servers) {
  const out = {};
  for (const key of Object.keys(servers || {})) {
    const sp = key.indexOf(" ");
    const region = sp < 0 ? key : key.slice(0, sp), shard = sp < 0 ? "" : key.slice(sp + 1);
    (out[region] = out[region] || []).push(shard);
  }
  for (const r of Object.keys(out)) out[r].sort((a, b) => schedShardKey(a) - schedShardKey(b) || a.localeCompare(b));
  return out;
}
/* The occurrences as rows: ONE ROW PER START TIME, one cell per event
   starting then, cells by rank and then by name. `off` is the set of events
   the filter hides; a row left with no cells is dropped. An occurrence is
   live while now is inside [at, at + window); a null window (an event the
   bridge has no length for) counts as live only through its start minute,
   and an occurrence whose window has closed is dropped. */
function schedRows(occ, servers, nowMs, off) {
  const regionShards = schedRegionShards(servers);
  const byAt = new Map();
  for (const o of occ || []) {
    if (off && off.has(o.event)) continue;
    /* The bridge keeps an hour of history so a running event stays listed;
       one already over has nothing left to show here. */
    if (nowMs >= o.at_ms + (o.window_sec || 60) * 1000) continue;
    if (!byAt.has(o.at_ms)) byAt.set(o.at_ms, new Map());
    const evs = byAt.get(o.at_ms);
    if (!evs.has(o.event)) evs.set(o.event, { event: o.event, rank: schedRank(o.event), window_sec: o.window_sec, list: [] });
    evs.get(o.event).list.push(o);
  }
  const rows = [];
  for (const [at, evs] of [...byAt.entries()].sort((a, b) => a[0] - b[0])) {
    const cells = [...evs.values()].sort((a, b) => a.rank - b.rank || a.event.localeCompare(b.event));
    for (const c of cells) {
      const by = {};
      for (const o of c.list) {
        const sp = o.server.indexOf(" ");
        const region = sp < 0 ? o.server : o.server.slice(0, sp), shard = sp < 0 ? "" : o.server.slice(sp + 1);
        (by[region] = by[region] || []).push(shard);
      }
      c.regions = Object.keys(by).sort().map((region) => {
        const shards = by[region].sort((a, b) => schedShardKey(a) - schedShardKey(b) || a.localeCompare(b));
        const known = regionShards[region] || [];
        return { region, shards, all: known.length > 0 && known.every((s) => shards.includes(s)) };
      });
      const endMs = at + (c.window_sec || 60) * 1000;
      c.live = nowMs >= at && nowMs < endMs;
      c.left_sec = c.live ? Math.round((endMs - nowMs) / 1000) : null;
      delete c.list;
    }
    rows.push({ at_ms: at, cells });
  }
  return rows;
}
/* Every event in the payload, by rank, for the filter row. Hidden events are
   included so they can be switched back on. */
function schedEvents(occ, off) {
  const set = new Set((occ || []).map((o) => o.event));
  for (const e of off || []) set.add(e);
  return [...set].sort((a, b) => schedRank(a) - schedRank(b) || a.localeCompare(b));
}

/* The filter survives a reload. Browser storage can be absent or throw, so
   every touch is guarded and a failure just means the filter starts empty. */
const SCHED_OFF_KEY = "boss_timers_sched_off";
let SCHED_OFF = new Set();
try { SCHED_OFF = new Set(JSON.parse(localStorage.getItem(SCHED_OFF_KEY) || "[]")); } catch (x) {}
function schedToggle(ev) {
  SCHED_OFF.has(ev) ? SCHED_OFF.delete(ev) : SCHED_OFF.add(ev);
  try { localStorage.setItem(SCHED_OFF_KEY, JSON.stringify([...SCHED_OFF])); } catch (x) {}
  paint();
}

function schedView() {
  const srv = LIVE?.servers || {};
  if (LIVE_ERR || !Object.keys(srv).length) {
    const why = LIVE_ERR
      ? `This bridge has no <code>/schedule_live</code> (${esc(LIVE_ERR)}) - restart it on the current <code>market_bridge.py</code>.`
      : `The bridge has not received a published lineup from any shard yet. It arrives with each shard's
         <code>server_info</code>, so it fills within a minute of a restart unless the bridge is running
         <code>--boss-source aldata</code>, which carries no schedule.`;
    return `<p class="note warn">${why} Showing the computed windows instead.</p>` + legacySchedView();
  }
  const nowMs = Date.now(), occ = LIVE.occurrences || [];
  const rows = schedRows(occ, srv, nowMs, SCHED_OFF);
  const evs = schedEvents(occ, SCHED_OFF);
  const ages = Object.values(srv).map((s) => s.age_sec).filter((a) => a != null);
  const oldest = ages.length ? Math.max(...ages) : null;
  const evName = (e) => `<span class="ev r${schedRank(e)}">${esc(e)}</span><span class="rk">${schedRank(e)}</span>`;
  const filters = evs.map((e) =>
    `<span class="fchip${SCHED_OFF.has(e) ? " off" : ""}" data-ev="${esc(e)}">${evName(e)}</span>`).join("");
  const cols = Math.max(1, ...rows.map((r) => r.cells.length));
  let body = "", lastDay = "";
  for (const r of rows) {
    const day = fDay.format(new Date(r.at_ms));
    if (day !== lastDay) { body += `<tr class="daysep"><td colspan="${cols + 2}">${esc(day)}</td></tr>`; lastDay = day; }
    const live = r.cells.filter((c) => c.live);
    const when = live.length
      ? `<span class="up">live, ${dur(Math.max(...live.map((c) => c.left_sec)))} left</span>`
      : `in ${dur((r.at_ms - nowMs) / 1000)}`;
    let cells = r.cells.map((c) => `<td class="evcell"><div class="evhead">${evName(c.event)}</div>${
      c.regions.map((g) => `<span class="chip"><b>${esc(g.region)}</b> ${g.all ? "all" : esc(g.shards.join(" "))}</span>`).join("")}</td>`).join("");
    for (let i = r.cells.length; i < cols; i++) cells += `<td class="evcell"></td>`;
    body += `<tr class="${live.length ? "liverow" : ""}"><td class="num">${clock(r.at_ms)}</td><td class="dim">${when}</td>${cells}</tr>`;
  }
  return `<p class="note">The game's own published lineup, all times ${tzName}. One row per start time; events
    starting together sit side by side, ordered by rank (the number beside each name). Click an event to hide or
    show it. ${Object.keys(srv).length} shards reporting${oldest != null ? `, oldest copy ${dur(oldest)} old` : ""}.</p>
  <div class="filters">${filters}</div>
  ${rows.length ? `<table><thead><tr><th class="num">Start</th><th>When</th>${"<th>Event</th>".repeat(cols)}</tr></thead>
  <tbody>${body}</tbody></table>` : `<p class="empty">Nothing in this window${SCHED_OFF.size ? " with the current filter" : ""}.</p>`}`;
}

function legacySchedView() {
  const srv = SCHED?.servers || [];
  if (!srv.length) return `<p class="empty">No servers known yet.</p>`;
  const off = Object.entries(SCHED.region_offset)
    .map(([r, o]) => `${r} ${o >= 0 ? "+" : ""}${o}`).join(", ");
  const head = `<p class="note">Daily and nightly windows, all times ${tzName}.
    The game clock is offset per <b class="hi">region</b>, not per server
    (${esc(off)}), so every shard in a region opens at the same moment — the rows are
    listed per server because that is how you will use them. Dailies fire at game hours
    ${SCHED.daily_hours_game.join(" and ")}, the nightly at
    ${SCHED.nightly_hours_game.join(" and ")}.</p>
  <p class="note"><b class="hi">Which event fires is not predictable.</b> Both rotations are
    shuffled when a server process starts, so it differs between shards and changes on every
    restart. <code>${esc((SCHED.daily_events||[]).join(", "))}</code> rotate for dailies and
    <code>${esc((SCHED.nightly_events||[]).join(", "))}</code> for nightlies.
    <b class="hi">Observed</b> is filled in from the kill log when the event spawns a monster;
    <code>${esc((SCHED.never_observable||[]).join(", "))}</code> are not monsters and can never
    appear there, so a blank means "not known", never "nothing ran".</p>
  <p class="note"><b class="hi">These offsets are fixed and do not follow daylight saving</b>,
    so every window below sits at a constant UTC hour while its ${tzName} time moves an hour
    when US DST ends 2026-11-01. That is why the page converts with a named zone rather than a
    stored offset. Source: ${esc(SCHED.source)}.</p>`;
  return head + srv.map(s => {
    const next = s.windows.find(w => w.in_sec > 0);
    return `<h2>${esc(s.server)} <span class="dim">— region clock ${
      s.time_offset >= 0 ? "+" : ""}${s.time_offset}${
      next ? `, next window in ${dur(next.in_sec)}` : ""}</span></h2>
    <table><thead><tr>
      <th>Kind</th><th>Opens</th><th class="num">In</th><th class="num">Window</th>
      <th>Observed</th><th>Could be</th>
    </tr></thead><tbody>${s.windows.map(w => `<tr class="${w.in_sec < 0 && !w.running ? "thin" : ""}">
      <td class="${w.kind === "nightly" ? "hot" : ""}">${esc(w.kind)}</td>
      <td>${w.running ? '<span class="pill up">OPEN</span> ' : ""}<b class="hi">${fDow.format(new Date(w.at))}</b></td>
      <td class="num ${w.in_sec > 0 && w.in_sec < 1800 ? "warn" : "dim"}">${
        w.running ? "now" : w.in_sec < 0 ? "past" : dur(w.in_sec)}</td>
      <td class="num dim">${dur(w.window_sec)}</td>
      <td>${w.observed ? `<span class="up">${esc(w.observed)}</span>`
          : w.in_sec < 0 ? '<span class="dim">—</span>' : ""}</td>
      <td class="dim">${esc(w.candidates.join(", "))}</td>
    </tr>`).join("")}</tbody></table>`;
  }).join("");
}

/* --------------------------------------------------------------- ranking */
function rankView() {
  const rows = (HIST.history || []).filter(r => r.type === TYPE)
    /* Qualified rows first, THEN by rate. Sorting on rate alone put a
       one-kill server at the top of the table the home decision is made
       from - a short window turns a single kill into a huge rate. */
    .sort((a, b) => (a.enough_data === b.enough_data)
      ? (b.kills_per_day || 0) - (a.kills_per_day || 0)
      : (a.enough_data ? -1 : 1));
  const min = HIST.min_kills_for_trend;
  const head = `<p class="note">The decision view, for <b class="hi">${esc(TYPE)}</b>,
    sorted by kills per day. <b class="hi">Rows with fewer than ${min} logged kills are
    greyed out</b> — that is an anecdote, not a trend, and a home change costs a 36-hour
    cooldown. <b class="hi">Stalls</b> are spawns that were never killed: a server where the
    boss spawns, gets nibbled and is abandoned shows no bad TTK, because it produces no TTK
    at all, and it is the worst possible home. Medians exclude low-confidence kills.
    dps is deliberately absent here — it is a trailing average and reads low on a ramping
    fight, so it would mislead a direct comparison.</p>
    <p class="note"><b class="hi">Comparing types:</b> kills per day is comparable across
    bosses, which is the number that matters for achievement score per hour. mrpumpkin
    respawns on a 54-minute cycle against mrgreen's 94, with the same 36,000,000 hp and the
    same 7 achievement rungs — so switch the selector and compare rather than assuming the
    bigger name is the better target.</p>
    <p class="note">DESPAWNS ARE NOT KILLS. A timed event boss that reaches the end of its
    window unfinished leaves the shard without dying, and until 2026-10-18 the poller logged
    that as a kill - 20 of 37 event-boss "deaths" in the log were despawns. The column
    separates them, which is what tells a shard where the boss is regularly FINISHED from one
    where it merely spawns and expires, and both of those from a shard where it never spawned
    at all. An arrow marks rows reclassified on read rather than logged that way.</p>`;
  if (!rows.length) return head + `<p class="empty">No ${esc(TYPE)} history logged yet.
    The log cannot be backfilled — a death is unrecoverable once the boss respawns — so
    this fills as the poller watches.</p>`;
  // The write path's own threshold, mirrored here only for the tooltip text.
  const b_pct = 5;
  return head + `<table><thead><tr>
    <th>Server</th><th class="num">Kills/day</th><th class="num">Kills logged</th>
    <th class="num">Despawns</th>
    <th class="num">Sample</th><th class="num">Stalls</th><th class="num">Median TTK</th>
    <th class="num">p25</th><th class="num">p75</th><th class="num">Last kill</th>
    <th class="num">Last despawn</th><th class="num">Window</th>
  </tr></thead><tbody>${rows.map(r => `<tr class="${r.enough_data ? "" : "thin"}">
    <td>${esc(r.server)}${r.enough_data ? "" :
       ` <span class="warn" title="fewer than ${min} kills logged">thin</span>`}</td>
    <td class="num up">${r.kills_per_day == null ? "—" : r.kills_per_day.toFixed(2)}${
       r.rate_capped ? ` <span class="warn" title="raw ${r.kills_per_day_raw} exceeds the physical ceiling of ${r.kills_per_day_cap} for this respawn">capped</span>` : ""}</td>
    <td class="num">${r.kills_logged}</td>
    <td class="num ${r.despawns ? "warn" : "dim"}">${r.despawns == null ? "—" : r.despawns}${
       r.despawns_reclassified ? ` <span class="warn" title="${r.despawns_reclassified} of these were logged as kills before the despawn test existed and are reclassified on read, not rewritten on disk${
         r.despawns_reclassified_low ? `. ${r.despawns_reclassified_low} of them had ${b_pct}% hp or less left, so a kill finished in the last minutes of the window would look the same - treat those as uncertain` : ""}">\u2191${
         r.despawns_reclassified_low ? "?" : ""}</span>` : ""}</td>
    <td class="num dim">${r.ttk_sample}${r.confidence_counts.low
       ? ` <span class="warn" title="${r.confidence_counts.low} low-confidence kills, excluded from medians">*</span>` : ""}</td>
    <td class="num ${r.stalled_count ? "dead" : "dim"}">${r.stalled_count}</td>
    <td class="num">${dur(r.ttk_median_sec)}</td>
    <td class="num dim">${dur(r.ttk_p25_sec)}</td>
    <td class="num dim">${dur(r.ttk_p75_sec)}</td>
    <td class="num dim">${stamp(r.last_kill_t)}</td>
    <td class="num dim">${stamp(r.last_despawn_t)}</td>
    <td class="num dim">${dur(r.observed_window_sec)}</td>
  </tr>`).join("")}</tbody></table>`;
}

function paint() {
  statusLine();
  const el = document.getElementById("view");
  if (ERR && !BOSSES) {
    el.innerHTML = `<p class="empty">No data. Is the bridge running?
      <code>python3 market_bridge.py</code></p>`; return;
  }
  el.innerHTML = VIEW === "now" ? nowView()
               : VIEW === "timers" ? timersView()
               : VIEW === "sched" ? schedView() : rankView();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  VIEW = b.dataset.v; syncTypes(); paint();
});
document.getElementById("type").onchange = e => { TYPE = e.target.value; paint(); };
document.getElementById("hours").onchange = e => { HOURS = Number(e.target.value) || 24; refresh(); };
/* Delegated, because the view is re-rendered every second. */
document.getElementById("view").onclick = e => {
  const f = e.target.closest(".fchip");
  if (f && VIEW === "sched") schedToggle(f.dataset.ev);
};
refresh();
setInterval(refresh, 15000);
/* Re-render between fetches so countdowns tick rather than stepping 15s. */
setInterval(() => { if (VIEW !== "rank" && BOSSES) paint(); }, 1000);
</script>
</body>
</html>
