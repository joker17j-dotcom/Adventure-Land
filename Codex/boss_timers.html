<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boss timers &amp; kill log</title>
<!--
  Served by the bridge at GET /boss_page, which makes it same-origin with the
  JSON routes. It also works opened straight off disk: BASE below falls back
  to the absolute loopback address when the protocol is file:.

  TIMEZONE. Every timestamp crossing the wire is ISO-8601 UTC, exactly as
  /bosses already sends it, and the conversion happens HERE through
  Intl.DateTimeFormat with a named zone. Nothing server-side computes an
  offset and nothing anywhere hardcodes -04:00: the operator is UTC-04:00
  today, but US DST ends 2026-11-01, and a baked-in offset would quietly go
  an hour wrong on every timer that night. A named zone handles it.
-->
<style>
  :root { --bg:#11151c; --panel:#171d26; --line:#242d3a; --txt:#d7dee8;
          --dim:#8b98ab; --up:#7FD98A; --dead:#e2605a; --warn:#e8b457;
          --accent:#6fb3e0; --hot:#c58bd6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex;
           gap:14px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; font-weight:600; }
  h2 { font-size:13px; margin:22px 0 8px; font-weight:600; color:var(--accent); }
  .tabs { display:flex; gap:4px; }
  .tab, select { padding:4px 11px; border:1px solid var(--line); border-radius:4px;
         cursor:pointer; color:var(--dim); background:#131922; font:inherit; }
  .tab.on { color:var(--txt); border-color:var(--accent); background:#1b2430; }
  select { color:var(--txt); }
  .grow { flex:1; }
  #status { color:var(--dim); font-size:12px; }
  #status.bad { color:var(--dead); }
  main { padding:12px 16px 48px; }
  table { border-collapse:collapse; width:100%; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:11px;
       text-transform:uppercase; letter-spacing:.05em; padding:6px 10px;
       border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:5px 10px; border-bottom:1px solid #1c2531; white-space:nowrap; }
  tr:hover td { background:#1a212c; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .dim { color:var(--dim); } .up { color:var(--up); } .dead { color:var(--dead); }
  .warn { color:var(--warn); }
  .thin td { opacity:.42; }              /* below the trend threshold */
  .bar { position:relative; width:100px; height:9px; background:#232c38;
         border-radius:2px; overflow:hidden; display:inline-block; vertical-align:middle; }
  .bar i { position:absolute; inset:0 auto 0 0; background:var(--up); }
  .bar.low i { background:var(--warn); } .bar.crit i { background:var(--dead); }
  .pill { padding:1px 6px; border-radius:3px; font-size:11px; border:1px solid; }
  .pill.up { border-color:#2f5e3a; background:#16301d; color:var(--up); }
  .pill.dead { border-color:#5e2f2f; background:#301616; color:var(--dead); }
  .pill.stale { border-color:#5e4f2f; background:#302716; color:var(--warn); }
  .note { color:var(--dim); margin:0 0 10px; max-width:84ch; }
  .empty { color:var(--dim); padding:24px 10px; }
  code { color:var(--hot); }
  b.hi { color:var(--txt); }
</style>
</head>
<body>
<header>
  <h1>Boss timers</h1>
  <div class="tabs">
    <button class="tab on" data-v="now">Now</button>
    <button class="tab" data-v="timers">Timers</button>
    <button class="tab" data-v="rank">Server ranking</button>
  </div>
  <select id="type" hidden></select>
  <span class="grow"></span>
  <span id="status">connecting…</span>
</header>
<main><div id="view"></div></main>

<script>
/* Same-origin when served from /boss_page; absolute when opened from disk. */
const BASE = location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8787";
const TZ = "America/New_York";
let VIEW = "now", TYPE = "mrgreen", BOSSES = null, HIST = null, ERR = null;

const fClock = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, hour:"numeric", minute:"2-digit", hour12:true });
const fStamp = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, month:"short", day:"numeric", hour:"numeric", minute:"2-digit", hour12:true });
const tzName = new Intl.DateTimeFormat("en-US",
  { timeZone: TZ, timeZoneName:"short" }).formatToParts(new Date())
  .find(p => p.type === "timeZoneName").value;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const clock = iso => iso ? fClock.format(new Date(iso)) : "—";
const stamp = iso => iso ? fStamp.format(new Date(iso)) : "—";
const num = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
function dur(sec) {
  if (sec == null || !isFinite(sec)) return "—";
  const s = Math.max(0, Math.round(sec)), h = Math.floor(s/3600),
        m = Math.floor((s%3600)/60), r = s%60;
  return h ? `${h}h${String(m).padStart(2,"0")}m` : m ? `${m}m${String(r).padStart(2,"0")}s` : `${r}s`;
}
const secsTo = iso => iso ? (new Date(iso).getTime() - Date.now())/1000 : null;

async function grab(p) {
  const r = await fetch(BASE + p, { cache:"no-store" });
  if (!r.ok) throw new Error(p + " -> HTTP " + r.status);
  return r.json();
}
async function refresh() {
  try {
    const [b, h] = await Promise.all([grab("/bosses"), grab("/boss_history")]);
    BOSSES = b; HIST = h; ERR = null;
  } catch (x) { ERR = x.message; }
  syncTypes(); paint();
}

function allTypes() {
  const set = new Set();
  (BOSSES?.bosses || []).forEach(r => set.add(r.type));
  (HIST?.history || []).forEach(r => set.add(r.type));
  return [...set].sort();
}
function syncTypes() {
  const sel = document.getElementById("type"), types = allTypes();
  sel.hidden = (VIEW === "now") || !types.length;
  if (sel.hidden) return;
  if (!types.includes(TYPE)) TYPE = types[0];
  sel.innerHTML = types.map(t =>
    `<option${t === TYPE ? " selected" : ""}>${esc(t)}</option>`).join("");
}

function statusLine() {
  const el = document.getElementById("status");
  if (ERR) { el.className = "bad"; el.textContent = "bridge unreachable — " + ERR; return; }
  const p = BOSSES.poller, bits = [];
  if (!p.enabled) bits.push("poller OFF");
  else if (p.last_error) bits.push(`ALData failing ×${p.consecutive_failures} (backing off)`);
  else bits.push(`polled ${p.last_success_age_sec ?? "?"}s ago`);
  bits.push(`${BOSSES.count} tracked`, `${HIST.deaths} kills logged`, `times ${tzName}`);
  if (p.events_error) bits.push("LOG WRITE FAILING");
  el.className = (p.last_error || p.events_error || !p.enabled) ? "bad" : "";
  el.textContent = bits.join(" · ");
}

/* ------------------------------------------------------------------- now */
function nowView() {
  const rows = (BOSSES.bosses || []).slice().sort((a, b) => {
    const ad = a.live && a.dps > 0, bd = b.live && b.dps > 0;
    if (ad !== bd) return ad ? -1 : 1;                      // dying first
    if (a.live !== b.live) return a.live ? -1 : 1;          // then merely up
    return (secsTo(a.estimated_respawn) ?? 1e12) - (secsTo(b.estimated_respawn) ?? 1e12);
  });
  if (!rows.length) return `<p class="empty">Nothing tracked yet — the poller seeds on its
    first successful ALData call.</p>`;
  return `<p class="note">Live and dying first, then up, then soonest back.
    <code>dps 0</code> is measured — somebody looked and nothing is happening — while
    <code>—</code> means not enough refreshed readings yet. Those are different answers,
    and the first one is a boss being abandoned.</p>
  <table><thead><tr>
    <th>Boss</th><th>Server</th><th>Status</th><th>HP</th><th class="num">HP left</th>
    <th class="num">dps</th><th>When</th><th>Target</th>
  </tr></thead><tbody>${rows.map(nowRow).join("")}</tbody></table>`;
}
function nowRow(r) {
  const pct = r.pct == null ? null : Math.max(0, Math.min(100, r.pct));
  const cls = pct == null ? "" : pct < 15 ? " crit" : pct < 50 ? " low" : "";
  let pill = r.live ? `<span class="pill up">UP</span>`
           : r.estimated_respawn ? `<span class="pill dead">DEAD</span>`
           : `<span class="pill stale">?</span>`;
  if (r.live && r.stale) pill += ` <span class="warn">stale</span>`;
  let when;
  if (r.live) {
    when = r.eta_sec != null
      ? `<span class="up">up, ~${dur(r.eta_sec)} left</span>`
      : r.dps === 0 ? `<span class="warn">up, nothing happening</span>`
                    : `<span class="dim">up</span>`;
  } else if (r.estimated_respawn) {
    const s = secsTo(r.estimated_respawn);
    when = `respawns <b class="hi">${clock(r.estimated_respawn)}</b> ` +
           `<span class="${s != null && s < 300 ? "warn" : "dim"}">` +
           `(${s == null ? "—" : s <= 0 ? "due" : "in " + dur(s)})</span>`;
  } else when = `<span class="dim">—</span>`;
  return `<tr>
    <td>${esc(r.type)}</td><td>${esc(r.server)}</td><td>${pill}</td>
    <td>${pct == null ? '<span class="dim">—</span>'
        : `<span class="bar${cls}"><i style="width:${pct}%"></i></span> <span class="dim">${pct.toFixed(1)}%</span>`}</td>
    <td class="num">${num(r.hp)}</td>
    <td class="num ${r.dps === 0 ? "warn" : ""}">${r.dps == null ? "—" : num(r.dps)}</td>
    <td>${when}</td>
    <td>${r.target ? esc(r.target) : '<span class="dim">—</span>'}</td>
  </tr>`;
}

/* ---------------------------------------------------------------- timers */
function timersView() {
  const rows = (BOSSES.bosses || []).filter(r => r.type === TYPE)
    .sort((a, b) => (secsTo(a.estimated_respawn) ?? (a.live ? -1 : 1e12))
                  - (secsTo(b.estimated_respawn) ?? (b.live ? -1 : 1e12)));
  if (!rows.length) return `<p class="empty">No ${esc(TYPE)} entries tracked.</p>`;
  const cycle = rows[0].respawn_sec;
  return `<p class="note">Next <b class="hi">${esc(TYPE)}</b> window per server, ${tzName}.
    ${cycle ? `Nominal cycle ${dur(cycle)}.` : `No respawn constant for this type — it is
    event-spawned, so no timer is computed.`}</p>
  <table><thead><tr>
    <th>Server</th><th>Status</th><th class="num">HP left</th>
    <th>Respawns</th><th class="num">In</th><th class="num">Last seen</th>
  </tr></thead><tbody>${rows.map(r => {
    const s = secsTo(r.estimated_respawn);
    return `<tr>
      <td>${esc(r.server)}</td>
      <td>${r.live ? '<span class="pill up">UP NOW</span>' :
            r.estimated_respawn ? '<span class="pill dead">dead</span>' :
            '<span class="pill stale">?</span>'}</td>
      <td class="num">${r.live ? num(r.hp) : "—"}</td>
      <td>${r.live ? '<span class="up">now</span>'
            : r.estimated_respawn ? `<b class="hi">${clock(r.estimated_respawn)}</b>` : "—"}</td>
      <td class="num ${s != null && s > 0 && s < 300 ? "warn" : ""}">${
        r.live ? "—" : s == null ? "—" : s <= 0 ? "due" : dur(s)}</td>
      <td class="num dim">${r.age_sec == null ? "—" : dur(r.age_sec) + " ago"}</td>
    </tr>`; }).join("")}</tbody></table>`;
}

/* --------------------------------------------------------------- ranking */
function rankView() {
  const rows = (HIST.history || []).filter(r => r.type === TYPE)
    .sort((a, b) => (b.kills_per_day || 0) - (a.kills_per_day || 0));
  const min = HIST.min_kills_for_trend;
  const head = `<p class="note">The decision view, for <b class="hi">${esc(TYPE)}</b>,
    sorted by kills per day. <b class="hi">Rows with fewer than ${min} logged kills are
    greyed out</b> — that is an anecdote, not a trend, and a home change costs a 36-hour
    cooldown. <b class="hi">Stalls</b> are spawns that were never killed: a server where the
    boss spawns, gets nibbled and is abandoned shows no bad TTK, because it produces no TTK
    at all, and it is the worst possible home. Medians exclude low-confidence kills.
    dps is deliberately absent here — it is a trailing average and reads low on a ramping
    fight, so it would mislead a direct comparison.</p>
    <p class="note"><b class="hi">Comparing types:</b> kills per day is comparable across
    bosses, which is the number that matters for achievement score per hour. mrpumpkin
    respawns on a 54-minute cycle against mrgreen's 94, with the same 36,000,000 hp and the
    same 7 achievement rungs — so switch the selector and compare rather than assuming the
    bigger name is the better target.</p>`;
  if (!rows.length) return head + `<p class="empty">No ${esc(TYPE)} history logged yet.
    The log cannot be backfilled — a death is unrecoverable once the boss respawns — so
    this fills as the poller watches.</p>`;
  return head + `<table><thead><tr>
    <th>Server</th><th class="num">Kills/day</th><th class="num">Kills logged</th>
    <th class="num">Sample</th><th class="num">Stalls</th><th class="num">Median TTK</th>
    <th class="num">p25</th><th class="num">p75</th><th class="num">Last kill</th>
    <th class="num">Window</th>
  </tr></thead><tbody>${rows.map(r => `<tr class="${r.enough_data ? "" : "thin"}">
    <td>${esc(r.server)}${r.enough_data ? "" :
       ` <span class="warn" title="fewer than ${min} kills logged">thin</span>`}</td>
    <td class="num up">${r.kills_per_day == null ? "—" : r.kills_per_day.toFixed(2)}</td>
    <td class="num">${r.kills_logged}</td>
    <td class="num dim">${r.ttk_sample}${r.confidence_counts.low
       ? ` <span class="warn" title="${r.confidence_counts.low} low-confidence kills, excluded from medians">*</span>` : ""}</td>
    <td class="num ${r.stalled_count ? "dead" : "dim"}">${r.stalled_count}</td>
    <td class="num">${dur(r.ttk_median_sec)}</td>
    <td class="num dim">${dur(r.ttk_p25_sec)}</td>
    <td class="num dim">${dur(r.ttk_p75_sec)}</td>
    <td class="num dim">${stamp(r.last_kill_t)}</td>
    <td class="num dim">${dur(r.observed_window_sec)}</td>
  </tr>`).join("")}</tbody></table>`;
}

function paint() {
  statusLine();
  const el = document.getElementById("view");
  if (ERR && !BOSSES) {
    el.innerHTML = `<p class="empty">No data. Is the bridge running?
      <code>python3 market_bridge.py</code></p>`; return;
  }
  el.innerHTML = VIEW === "now" ? nowView() : VIEW === "timers" ? timersView() : rankView();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  VIEW = b.dataset.v; syncTypes(); paint();
});
document.getElementById("type").onchange = e => { TYPE = e.target.value; paint(); };
refresh();
setInterval(refresh, 15000);
/* Re-render between fetches so countdowns tick rather than stepping 15s. */
setInterval(() => { if (VIEW !== "rank" && BOSSES) paint(); }, 1000);
</script>
</body>
</html>
